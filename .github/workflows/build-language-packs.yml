name: Build Language Packs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build ZIPs
        run: python build_language_packs.py

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest release
        run: |
          gh release create latest \
            --title "CRE8 Comments Language Packs (latest)" \
            --notes "Automatically built from the latest translations on \`main\`.

          **Install:** Download the ZIP for your language and install via *Joomla → System → Install → Extensions*." \
            dist/*.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate downloads-komento.xml
        run: |
          python3 << 'PYEOF'
          import re, subprocess, urllib.request, json, os
          from pathlib import Path
          from datetime import datetime, timezone

          # ── Weblate language code → Joomla locale ─────────────────────────────
          WEBLATE_TO_JOOMLA = {
              'ar_SA': 'ar-SA', 'bg': 'bg-BG', 'ca': 'ca-ES', 'zh_Hans': 'zh-CN',
              'cs': 'cs-CZ', 'da': 'da-DK', 'nl': 'nl-NL', 'et': 'et-EE',
              'fi': 'fi-FI', 'fr': 'fr-FR', 'de': 'de-DE', 'el': 'el-GR',
              'hu': 'hu-HU', 'it': 'it-IT', 'nb_NO': 'nb-NO', 'fa': 'fa-IR',
              'pl': 'pl-PL', 'pt_BR': 'pt-BR', 'pt_PT': 'pt-PT', 'ro': 'ro-RO',
              'ru': 'ru-RU', 'sr_Cyrl': 'sr-Cyrl', 'sk': 'sk-SK', 'es': 'es-ES',
              'sv': 'sv-SE', 'tr': 'tr-TR', 'vi': 'vi-VN',
          }

          # ── Fetch translation progress from Weblate ────────────────────────────
          progress_map = {}
          weblate_token = os.environ.get('WEBLATE_TOKEN', '').strip()
          if weblate_token:
              url = 'https://translate.creative-graphics.ch/api/projects/komento/languages/?format=json'
              req = urllib.request.Request(url, headers={'Authorization': f'Token {weblate_token}'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      for lang in json.loads(r.read()):
                          joomla = WEBLATE_TO_JOOMLA.get(lang['code'])
                          if joomla:
                              progress_map[joomla] = round(lang['translated_percent'])
                  print(f'Weblate stats fetched: {len(progress_map)} locales')
              except Exception as e:
                  print(f'Warning: could not fetch Weblate stats: {e}')
          else:
              print('Warning: WEBLATE_TOKEN not set — progress will be 0 for all locales')

          lang_names = {
              "ar-SA": "Arabic",                  "bg-BG": "Bulgarian",
              "ca-ES": "Catalan",                 "cs-CZ": "Czech",
              "da-DK": "Danish",                  "de-DE": "German",
              "el-GR": "Greek",                   "es-ES": "Spanish",
              "et-EE": "Estonian",                "fa-IR": "Persian",
              "fi-FI": "Finnish",                 "fr-FR": "French",
              "hu-HU": "Hungarian",               "it-IT": "Italian",
              "nb-NO": "Norwegian",               "nl-NL": "Dutch",
              "pl-PL": "Polish",                  "pt-BR": "Portuguese (Brazil)",
              "pt-PT": "Portuguese",
              "ro-RO": "Romanian",                "ru-RU": "Russian",
              "sk-SK": "Slovak",                  "sr-Cyrl": "Serbian",
              "sv-SE": "Swedish",                 "tr-TR": "Turkish",
              "vi-VN": "Vietnamese",               "zh-CN": "Chinese (Simplified)",
          }

          base_url = "https://github.com/translation-creative-graphics/komento/releases/download/latest"

          items = []
          for zip_file in sorted(Path("dist").glob("com_komento_*.zip")):
              match = re.search(r"com_komento_([a-zA-Z]{2}[-_][a-zA-Z]{2,4})\.zip", zip_file.name)
              if not match:
                  continue
              code = match.group(1)
              name = lang_names.get(code, code)
              size = zip_file.stat().st_size
              download = f"{base_url}/{zip_file.name}"
              progress = progress_map.get(code, 0)

              result = subprocess.run(
                  ["git", "log", "-1", "--format=%cI", "--",
                   f"language/{code}/", f"administrator/language/{code}/"],
                  capture_output=True, text=True
              )
              raw = result.stdout.strip()
              if raw:
                  updated = datetime.fromisoformat(raw).astimezone(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')
              else:
                  updated = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')

              items.append({"code": code, "name": name, "download": download, "size": size, "updated": updated, "progress": progress})

          items.sort(key=lambda x: x["name"].lower())

          lines = ['<?xml version="1.0" encoding="UTF-8"?>', "<languages>"]
          for item in items:
              lines += [
                  "  <language>",
                  f"    <code>{item['code']}</code>",
                  f"    <name>{item['name']}</name>",
                  f"    <download>{item['download']}</download>",
                  f"    <size>{item['size']}</size>",
                  f"    <updated>{item['updated']}</updated>",
                  f"    <progress>{item['progress']}</progress>",
                  "  </language>",
              ]
          lines.append("</languages>")

          Path("downloads-komento.xml").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Generated downloads-komento.xml with {len(items)} languages")
          PYEOF

      - name: Commit downloads-komento.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads-komento.xml
          git diff --staged --quiet || git commit -m "chore: update downloads-komento.xml [skip ci]"
          git pull --rebase
          git push
